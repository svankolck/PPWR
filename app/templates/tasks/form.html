{% extends "base.html" %}
{% block title %}{{ 'Edit' if task else 'New' }} Task - PPWR{% endblock %}
{% block content %}
<h3>{{ 'Edit' if task else 'New' }} Task</h3>
<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-select">
                        {% for p in priorities %}<option value="{{ p }}" {% if task and task.priority == p %}selected{% endif %}>{{ p | title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ task.description if task else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Packaging</label>
                    <select name="packaging_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for p in packaging_items %}<option value="{{ p.id }}" {% if task and task.packaging_id == p.id %}selected{% endif %}>{{ p.code }} - {{ p.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Supplier</label>
                    <select name="supplier_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for s in suppliers %}<option value="{{ s.id }}" {% if task and task.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Assigned To</label>
                    <input type="text" name="assigned_to" class="form-control" value="{{ task.assigned_to if task else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statuses %}<option value="{{ s }}" {% if task and task.status == s %}selected{% endif %}>{{ s | replace('_',' ') | title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Update' if task else 'Create' }}</button>
            <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

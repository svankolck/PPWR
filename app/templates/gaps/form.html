{% extends "base.html" %}
{% block title %}{{ 'Edit' if gap else 'New' }} Gap - PPWR{% endblock %}
{% block content %}
<h3>{{ 'Edit' if gap else 'New' }} Gap</h3>
<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control" value="{{ gap.title if gap else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Severity</label>
                    <select name="severity" class="form-select">
                        {% for s in severities %}<option value="{{ s }}" {% if gap and gap.severity == s %}selected{% endif %}>{{ s | title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ gap.description if gap else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Packaging</label>
                    <select name="packaging_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for p in packaging_items %}<option value="{{ p.id }}" {% if gap and gap.packaging_id == p.id %}selected{% endif %}>{{ p.code }} - {{ p.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Requirement</label>
                    <select name="requirement_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for r in requirements %}<option value="{{ r.id }}" {% if gap and gap.requirement_id == r.id %}selected{% endif %}>{{ r.code }} - {{ r.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Supplier</label>
                    <select name="supplier_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for s in suppliers %}<option value="{{ s.id }}" {% if gap and gap.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Owner</label>
                    <input type="text" name="owner" class="form-control" value="{{ gap.owner if gap else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control" value="{{ gap.due_date.isoformat() if gap and gap.due_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statuses %}<option value="{{ s }}" {% if gap and gap.status == s %}selected{% endif %}>{{ s | replace('_',' ') | title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Update' if gap else 'Create' }}</button>
            <a href="{{ url_for('gaps.list_gaps') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
